[project]
name = "eipsa"
version = "1.1.0"
description = "Bayesian dynamic panel analysis of pre-pandemic social cohesion and COVID-19 lockdown stringency in 37 OECD countries (JECH revision)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymc>=5.10",
    "arviz>=0.17",
    "netcdf4>=1.6",
    "libpysal>=4.14.1",
    "linearmodels>=7.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pycountry>=26.2.16",
    "requests>=2.33.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "wbdata>=1.1.0",
    "wbgapi>=1.0.14",
]
