[project]
name = "eipsa"
version = "1.0.0"
description = "Hierarchical Bayesian Dynamic Panel analysis of the association between pre-pandemic social cohesion and COVID-19 lockdown stringency across OECD countries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pymc>=5.10",
    "arviz<1.0",
    "numpy>=1.26,<2.5",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "netcdf4>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
